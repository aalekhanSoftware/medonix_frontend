<div class="sales-container">
  <app-loader *ngIf="isLoading" [show]="isLoading"></app-loader>

  <section class="search-section card">
    <h2>Sale Bills By Product</h2>
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()" role="search">
    <div class="search-controls">
      <div class="form-group">
        <label for="productId">Product <span class="required">*</span></label>
        <div class="product-select-group">
          <app-searchable-select formControlName="productId" [options]="products" labelKey="displayLabel" valueKey="id"
            [searchKeys]="['name', 'materialName', 'productCode']"
            [defaultOption]="{ label: 'Select Product', value: '' }" [searchPlaceholder]="'Search products...'"
            [focusWidthPx]="600" [initialDisplayLimit]="50" [maxHeight]="'320px'"></app-searchable-select>
          <button class="btn-icon refresh" (click)="refreshProducts()" [disabled]="isLoadingProducts"
            title="Refresh products">
            <i class="fas fa-sync-alt" [class.fa-spin]="isLoadingProducts"></i>
          </button>
        </div>
      </div>

      <div class="form-group" *ngIf="canManageSales">
        <label for="customerId">Customer</label>
        <app-searchable-select formControlName="customerId" [options]="customers" labelKey="name" valueKey="id"
          [defaultOption]="{ label: 'All Customers', value: '' }"
          [searchPlaceholder]="'Search customers...'"></app-searchable-select>
      </div>

      <div class="form-group">
        <label for="search">Invoice No.</label>
        <input type="text" formControlName="search" class="form-control" placeholder="Search by invoice number...">
      </div>

      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input type="date" formControlName="startDate" class="form-control">
      </div>

      <div class="form-group">
        <label for="endDate">End Date</label>
        <input type="date" formControlName="endDate" class="form-control">
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-search"></i> Search
        </button>
        <button type="button" class="btn btn-secondary" (click)="resetForm()">
          <i class="fas fa-undo"></i> Reset
        </button>
      </div>
    </div>
    </form>
  </section>

  <section class="sales-list card" *ngIf="sales.length > 0">
    <div class="table-responsive">
      <table class="table table-bordered table-hover">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Invoice No.</th>
            <th scope="col">Customer Name</th>
            <th scope="col">Sale Date</th>
            <th scope="col">Total Amount</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sale of sales; let i = index">
            <td data-label="#">{{ startIndex + i + 1 }}</td>
            <td data-label="Invoice No.">{{ sale.invoiceNumber }}</td>
            <td data-label="Customer Name">{{ sale.customerName }}</td>
            <td data-label="Sale Date">{{ formatDate(sale.saleDate) }}</td>
            <td data-label="Total Amount">{{ sale.totalSaleAmount | indianNumber }}</td>
            <td data-label="Actions" class="actions">
              <a *ngIf="canManageSales"
                class="btn-icon edit"
                aria-label="View sale details"
                [routerLink]="getEditRoute(sale.id!)">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </a>
              <button class="btn-icon pdf" (click)="generatePdf(sale.id!, sale.invoiceNumber)"
                [disabled]="exportingPdfId === sale.id"
                title="Download PDF">
                <i class="fas" [class.fa-spinner]="exportingPdfId === sale.id" [class.fa-file-pdf]="exportingPdfId !== sale.id"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination [currentPage]="currentPage" [pageSize]="pageSize" [totalElements]="totalElements"
      [pageSizeOptions]="pageSizeOptions" (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"></app-pagination>
  </section>

  <section class="sales-list card" *ngIf="sales.length === 0 && !isLoading">
    <div class="no-data">
      <i class="fas fa-inbox"></i>
      <p>Select a product and click Search to view sale bills.</p>
    </div>
  </section>
</div>
